<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>ATLAS Notebook & Drafting</title><link rel=manifest href=manifest.json><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#e9edf1;color:#20364b}header,nav{background:#20364b;color:white;padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit;padding:8px;border:1px solid #aab7c4;border-radius:6px;background:white;color:#20364b}button{cursor:pointer}button.active{background:#b9dfc9}main{padding:12px}#shelf{display:flex;gap:12px;flex-wrap:wrap}.book{width:145px;height:180px;background:#31556c;color:white;font-size:19px;overflow-wrap:anywhere}#paper{background:white;display:block;touch-action:none;box-shadow:0 2px 12px #0003;max-width:none}#viewport{overflow:auto;height:65vh;padding:12px}#editor[hidden],#library[hidden]{display:none}#status{padding:8px}label{display:inline-flex;align-items:center;gap:4px}nav{background:#d5dfe8;color:#20364b} @media print{header,nav,#status,#library{display:none!important}main,#viewport{padding:0;margin:0;height:auto;overflow:visible}#paper{width:8.5in!important;height:11in!important;box-shadow:none} @page{size:letter;margin:0}}</style></head><body><header><b>ATLAS / Notebook & Drafting</b><span>Prototype 01</span><button onclick="home()">Library</button><button onclick="backup()">Backup</button><button onclick="document.querySelector('#restore').click()">Restore</button><input id=restore type=file accept=.json hidden></header><main><section id=library><h2>My notebooks</h2><button onclick="newBook()">+ Notebook</button><div id=shelf></div></section><section id=editor hidden><nav><b id=bookname></b><button onclick="rename()">Rename</button><button onclick="delBook()">Delete notebook</button><button onclick="pageMove(-1)">◀</button><span id=pageLabel></span><button onclick="pageMove(1)">▶</button><button onclick="addPage()">+ Page</button><button onclick="delPage()">Delete page</button><button onclick="save()">Save</button><button onclick="print()">Print / PDF</button></nav><nav><label>Paper <select id=paperType><option>Graph</option><option>Lined</option><option>Dots</option><option>Blank</option></select></label><label>Scale <select id=scale></select></label><label>Grid <select id=grid><option value=3>3″</option><option value=6>6″</option><option value=12 selected>1′</option><option value=24>2′</option></select></label><label><input type=checkbox id=snap checked>Snap</label><label>Zoom <select id=zoom><option value=.5>50%</option><option value=1 selected>100%</option><option value=1.5>150%</option><option value=2>200%</option></select></label></nav><nav id=tools></nav><nav><label>Ink <input type=color id=ink value=#20364b></label><label>Thickness <select id=thick></select></label><label>Feet <input id=feet type=number min=0 value=10 style="width:65px"></label><label>Inches <input id=inches type=number min=0 max=11 value=6 style="width:65px"></label><select id=fraction></select><label>Angle <input id=angle type=number value=0 style="width:70px"></label><button onclick="exact()">Exact line</button><button onclick="undo()">Undo</button><button onclick="redo()">Redo</button><button onclick="document.querySelector('#photo').click()">Photo</button><input id=photo type=file accept=image/* hidden></nav><div id=status>Ready</div><div id=viewport><svg id=paper xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 1056" width=816 height=1056></svg></div></section></main><script>
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';let db;try{db=JSON.parse(localStorage.getItem('atlasNotebook01'))||[]}catch{db=[]}let bi=0,pi=0,tool='Pencil',start=null,preview=null,redoStack=[];const scales=[['1/16',.0625],['1/8',.125],['3/16',.1875],['1/4',.25],['3/8',.375],['1/2',.5],['3/4',.75],['1',1],['1½',1.5],['3',3],['Actual size',12]];for(const [n,v] of scales)$('scale').add(new Option(n==='Actual size'?n:n+'″ = 1′',v));for(let i=1;i<=10;i++)$('thick').add(new Option(i,i));for(let i=0;i<16;i++)$('fraction').add(new Option(i?i+'/16':'0',i/16));const fresh=()=>({type:'Graph',scale:.25,grid:12,items:[]});const p=()=>db[bi].pages[pi];function save(){try{localStorage.setItem('atlasNotebook01',JSON.stringify(db));$('status').textContent='Saved locally'}catch(e){$('status').textContent='Storage full or unavailable — export backup now';alert('Save failed. Export a backup.')}}function home(){save();$('editor').hidden=true;$('library').hidden=false;$('shelf').replaceChildren();db.forEach((b,i)=>{let el=document.createElement('button');el.className='book';el.textContent=b.name+' · '+b.pages.length+' pages';el.onclick=()=>openBook(i);$('shelf').append(el)})}function newBook(){let n=prompt('Notebook name');if(n?.trim()){db.push({name:n.trim(),pages:[fresh()]});openBook(db.length-1);save()}}function openBook(i){bi=i;pi=0;$('library').hidden=true;$('editor').hidden=false;load()}function load(){redoStack=[];$('bookname').textContent=db[bi].name;$('pageLabel').textContent=(pi+1)+' / '+db[bi].pages.length;$('paperType').value=p().type;$('scale').value=p().scale;$('grid').value=p().grid;render()}function rename(){let n=prompt('Name',db[bi].name);if(n?.trim()){db[bi].name=n.trim();load();save()}}function delBook(){if(confirm('Delete this notebook and all its pages?')){db.splice(bi,1);home()}}function pageMove(d){pi=Math.max(0,Math.min(db[bi].pages.length-1,pi+d));load()}function addPage(){db[bi].pages.push(fresh());pi=db[bi].pages.length-1;load();save()}function delPage(){if(confirm('Delete this page?')){db[bi].pages.splice(pi,1);if(!db[bi].pages.length)db[bi].pages.push(fresh());pi=Math.min(pi,db[bi].pages.length-1);load();save()}}function node(tag,a,parent=$('paper')){let e=document.createElementNS(NS,tag);for(let k in a)e.setAttribute(k,a[k]);parent.append(e);return e}const unit=()=>p().scale*8;function render(){let s=$('paper');s.replaceChildren();s.style.width=816*+$('zoom').value+'px';s.style.height=1056*+$('zoom').value+'px';node('rect',{width:816,height:1056,fill:'white'});let g=p().grid*unit();if(p().type==='Graph'||p().type==='Dots'){let defs=node('defs',{}),pat=node('pattern',{id:'gridPattern',width:g,height:g,patternUnits:'userSpaceOnUse'},defs);if(p().type==='Graph')node('path',{d:`M ${g} 0 H 0 V ${g}`,fill:'none',stroke:'#a9c3d8','stroke-width':.65},pat);else node('circle',{cx:0,cy:0,r:1,fill:'#a9c3d8'},pat);node('rect',{width:816,height:1056,fill:'url(#gridPattern)'})}if(p().type==='Lined')for(let y=30;y<1056;y+=28)node('line',{x1:0,x2:816,y1:y,y2:y,stroke:'#c4d5e4'});p().items.forEach(draw);if(preview)draw(preview)}function draw(o){let a={stroke:o.color,'stroke-width':o.w,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'};if(o.kind==='Pencil'||o.kind==='Highlighter')node('polyline',{...a,points:o.points.map(q=>q.join(',')).join(' '),opacity:o.kind==='Highlighter'?.35:1});else if(o.kind==='Rectangle')node('rect',{...a,x:Math.min(o.x,o.X),y:Math.min(o.y,o.Y),width:Math.abs(o.X-o.x),height:Math.abs(o.Y-o.y)});else if(o.kind==='Compass')node('circle',{...a,cx:o.x,cy:o.y,r:Math.hypot(o.X-o.x,o.Y-o.y)});else if(o.kind==='Text'){let t=node('text',{x:o.x,y:o.y,fill:o.color,'font-size':18});t.textContent=o.text}else if(o.kind==='Photo')node('image',{x:o.x,y:o.y,width:300,height:220,href:o.data});else{node('line',{...a,x1:o.x,y1:o.y,x2:o.X,y2:o.Y});if(o.kind==='Dimension'){let t=node('text',{x:(o.x+o.X)/2,y:(o.y+o.Y)/2-8,fill:o.color,'font-size':14,'text-anchor':'middle'});t.textContent=format(Math.hypot(o.X-o.x,o.Y-o.y)/o.unit)}}}function format(n){let v=Math.round(n*16),f=Math.floor(v/192),i=Math.floor(v%192/16),r=v%16;return `${f}′ ${i}${r?' '+r+'/16':''}″`}function point(e){let q=$('paper').createSVGPoint();q.x=e.clientX;q.y=e.clientY;q=q.matrixTransform($('paper').getScreenCTM().inverse());let g=p().grid*unit();return $('snap').checked&& !['Pencil','Highlighter','Eraser','Text'].includes(tool)?[Math.round(q.x/g)*g,Math.round(q.y/g)*g]:[q.x,q.y]}function commit(o){p().items.push(o);redoStack=[];preview=null;render();save()}for(let t of ['Pencil','Highlighter','Ruler','Rectangle','Compass','45° square','30° square','Protractor','Dimension','Text','Eraser']){let b=document.createElement('button');b.textContent=t;b.onclick=()=>{tool=t;document.querySelectorAll('#tools button').forEach(x=>x.classList.toggle('active',x===b))};$('tools').append(b)}$('tools').firstChild.classList.add('active');function make(q){let [x,y]=start,[X,Y]=q;if(tool.includes('square')){let a=(tool==='45° square'?45:30)*Math.PI/180;let l=Math.hypot(X-x,Y-y);X=x+Math.sign(X-x||1)*l*Math.cos(a);Y=y+Math.sign(Y-y||1)*l*Math.sin(a)}return {kind:tool,x,y,X,Y,color:$('ink').value,w:+$('thick').value*(tool==='Highlighter'?3:.6),unit:unit(),points:[start,q]}}let s=$('paper');s.onpointerdown=e=>{if(e.button!==0)return;s.setPointerCapture(e.pointerId);start=point(e);if(tool==='Text'){let text=prompt('Text');if(text)commit({...make(start),text});start=null;return}if(tool==='Eraser'){let [x,y]=start;let idx=p().items.findLastIndex(o=>o.points?o.points.some(q=>Math.hypot(q[0]-x,q[1]-y)<15):Math.hypot(o.x-x,o.y-y)<25|| (o.X!==undefined&&Math.hypot(o.X-x,o.Y-y)<25));if(idx>=0){p().items.splice(idx,1);redoStack=[];render();save()}start=null;return}preview=make(start)};s.onpointermove=e=>{if(!start)return;let q=point(e);if(['Pencil','Highlighter'].includes(tool))preview.points.push(q);else preview=make(q);render();let dx=q[0]-start[0],dy=q[1]-start[1];$('status').textContent=format(Math.hypot(dx,dy)/unit())+' · '+(Math.atan2(-dy,dx)*180/Math.PI).toFixed(1)+'°'};s.onpointerup=()=>{if(start&&preview){if(tool==='Protractor'){preview=null;render()}else commit(preview)}start=null};s.onpointercancel=()=>{start=null;preview=null;render()};function exact(){let n=+$('feet').value*12 + +$('inches').value + +$('fraction').value,a=+$('angle').value*Math.PI/180;if(!Number.isFinite(n)||n<=0)return alert('Enter a positive length');let x=48,y=96,X=x+n*unit()*Math.cos(a),Y=y-n*unit()*Math.sin(a);if(X<0||X>816||Y<0||Y>1056)return alert('Line exceeds page. Choose a smaller scale or different angle.');commit({kind:'Dimension',x,y,X,Y,color:$('ink').value,w:+$('thick').value*.6,unit:unit()})}function undo(){let o=p().items.pop();if(o)redoStack.push(o);render();save()}function redo(){let o=redoStack.pop();if(o)p().items.push(o);render();save()}for(let id of ['paperType','scale','grid'])$(id).onchange=()=>{if(id==='scale'&&p().items.length){alert('Scale is locked after drawing to preserve dimensions. Use a new page.');$('scale').value=p().scale;return}p().type=$('paperType').value;p().scale=+$('scale').value;p().grid=+$('grid').value;render();save()};$('zoom').onchange=render;$('photo').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>commit({kind:'Photo',x:48,y:48,data:r.result});r.readAsDataURL(f);e.target.value=''};function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,books:db})],{type:'application/json'}));a.download='ATLAS-notebooks-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('restore').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(v.version!==1||!Array.isArray(v.books)||!v.books.every(b=>typeof b.name==='string'&&Array.isArray(b.pages)&&b.pages.length&&b.pages.every(p=>Array.isArray(p.items)&&p.scale>0&&p.grid>0)))throw Error('Invalid backup');if(confirm('Import as additional notebooks? Existing notebooks will remain.')){db.push(...v.books);home()}}catch(e){alert('Restore failed: '+e.message)}e.target.value=''};home();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
